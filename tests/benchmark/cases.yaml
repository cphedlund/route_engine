# AtlasNav recommendation benchmark. Hard-constraint ground truth is computed from the routes data (app.ROUTE_DB), never from the engine.
# Optional per-case xfail: {owner, reason}. Applied as xfail(strict=True) by test_benchmark.py; metrics still use real pass/fail. Remove the field when the owner fixes the case (an XPASS fails the run).
# expect.hard keys: distance_mi [lo,hi], elev_gain_ft_max (number, or FLAT = max(300 ft, 60 ft/mi x route distance)), elev_gain_ft_min, require_bike_legal, require_dog_allowed, require_wheelchair, park, route_type, within_mi_of_user.
# must_include_any: list of route_ids, or 'auto' = every route in the data satisfying expect.hard.
# must_exclude_where: python expression over route facts (distance_mi, elev_gain_ft, park, route_type...); a returned route matching it is a violation at any rank.
# Violation rule: gates (bike, dog, wheelchair, park, route_type, proximity, must_exclude_where) are never excusable; distance/elevation targets are feasible-first (first F results, F = routes satisfying all hard constraints, must satisfy them).
# expect.pages: evaluate N paginated pages (batch 3) with the feasible-first rule. infeasible: no route satisfies hard; engine must relax and explain.
cases:
- id: reg-empty-001
  category: regression-false-empty
  query: flat 5 mile hike
  tags: &id001
  - regression
  - bug-false-empty
  owner: atlas-route-engine
  xfail:
    owner: atlas-route-engine
    reason: "engine distance window is +/-30% at 5 mi; case expects +/-15% (4.25-5.75 mi)"
  preferences:
    location:
      lat: 37.2358
      lng: -121.9624
      radius_km: 20
    lat: 37.2358
    lng: -121.9624
  expect:
    hard:
      distance_mi: &id002
      - 4.25
      - 5.75
      elev_gain_ft_max: FLAT
      within_mi_of_user: 12.4
    non_empty: true
    must_include_any: auto
